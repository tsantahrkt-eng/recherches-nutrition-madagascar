<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Inventaire des recherches en nutrition à Madagascar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .app-container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 4px;
      color: #22543d;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #4b5563;
      margin-bottom: 16px;
    }

    /* Onglets */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab-button {
      border: none;
      background: transparent;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 999px 999px 0 0;
      color: #4b5563;
    }

    .tab-button.active {
      background: #ffffff;
      color: #22543d;
      border: 1px solid #e5e7eb;
      border-bottom-color: #ffffff;
      font-weight: 600;
    }

    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 18px;
      border-left: 5px solid #2f855a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      background: #def7ec;
      color: #276749;
    }

    .badge span {
      font-weight: 600;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.88rem;
    }

    label {
      font-weight: 600;
      color: #374151;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    input[type="number"],
    select,
    textarea {
      border-radius: 8px;
      border: 1px solid #d1d5db;
      padding: 7px 9px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #f9fafb;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.2);
      background: #ffffff;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 7px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #2f855a;
      color: #ffffff;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #276749;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-icon {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      cursor: pointer;
    }

    .btn-icon:hover {
      background: #e5e7eb;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 0.78rem;
    }

    #search-bar-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    #search-input {
      flex: 1;
      min-width: 200px;
    }

    .hint {
      font-size: 0.8rem;
      color: #6b7280;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 8px;
      font-family: Verdana, Geneva, sans-serif;
    }

    thead {
      background: #f9fafb;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th,
    td {
      padding: 8px 6px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
      text-align: left;
    }

    th {
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background: #f9fafb;
    }

    .col-actions {
      white-space: nowrap;
    }

    .small-text {
      font-size: 0.8rem;
      color: #4b5563;
    }

    .nowrap {
      white-space: nowrap;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      background: #ecfdf3;
      color: #166534;
    }

    .no-data {
      font-size: 0.86rem;
      color: #6b7280;
      text-align: center;
      padding: 12px 0;
    }

    .products-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 6px;
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
    }

    /* Modal détails */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 18px 20px 16px;
      box-shadow: 0 20px 40px rgba(15,23,42,0.35);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .modal-close {
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 10px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(150px, 200px) 1fr;
      gap: 6px 12px;
      font-size: 0.85rem;
    }

    .detail-label {
      font-weight: 600;
      color: #374151;
    }

    .detail-value {
      color: #111827;
    }

    /* Stats */
    .stats-block {
      margin-bottom: 16px;
    }

    .stats-title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    @media (max-width: 768px) {
      .card {
        padding: 12px 12px;
      }

      /* Masquer une colonne non prioritaire sur mobile (par ex. Filière) */
      th:nth-child(6),
      td:nth-child(6) {
        display: none;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Inventaire des recherches en nutrition à Madagascar</h1>
  <p class="subtitle">
    Application locale pour recenser les travaux, les équipes impliquées, les produits issus des recherches et leur potentiel de vulgarisation.
  </p>

  <!-- ONGLET -->
  <div class="tabs">
    <button class="tab-button active" data-tab="form">Fiche</button>
    <button class="tab-button" data-tab="table">Tableau</button>
    <button class="tab-button" data-tab="stats">Statistiques</button>
  </div>

  <!-- ONGLET FICHE -->
  <section id="tab-form" class="tab-section active">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Nouvelle recherche / Modifier une fiche</div>
        <div class="badge"><span id="entry-count">0</span> fiche(s) enregistrée(s)</div>
      </div>

      <form id="study-form">
        <input type="hidden" id="edit-index" value="-1" />

        <div class="field full-width">
          <label for="title">Titre de la recherche</label>
          <input id="title" type="text" required
                 placeholder="Ex. État nutritionnel des enfants de moins de 5 ans dans …" />
        </div>

        <div class="field">
          <label for="institution">Institution / organisme porteur</label>
          <input id="institution" type="text"
                 placeholder="Université, centre de recherche, ONG, ministère, etc." />
        </div>

        <div class="field">
          <label for="year">Année</label>
          <input id="year" type="number" min="1950" max="2100" placeholder="2023" />
        </div>

        <div class="field">
          <label for="author">Auteur principal</label>
          <input id="author" type="text" placeholder="Nom Prénom" />
        </div>

        <div class="field">
          <label for="coauthors">Co-auteurs</label>
          <input id="coauthors" type="text" placeholder="Noms séparés par des virgules" />
        </div>

        <div class="field">
          <label for="email">Contact email</label>
          <input id="email" type="email" placeholder="auteur@institution.mg" />
        </div>

          <label for="phone">Contact téléphone</label>
